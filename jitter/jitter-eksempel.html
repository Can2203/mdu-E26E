<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jitter: animation og JavaScript</title>

    <!-- stylesheets -->
     <link rel="stylesheet" href="css/style.css">

    <!-- Load CDN script fra Cloudflare -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.10.2/lottie.min.js"></script>

</head>
<body>
    <h1>Jitter animation</h1>
    
    <p>Eksemplet viser, hvordan du kan starte og stoppe en Lottie fra Jitter.</p>
    <p>I designfaget vil du lære, hvordan man tegner i vektorprogrammer, som Figma og Jitter. Filen skal ekporteres til JSON - og så kan du bruge den sammen med JavaScript</p>

    <!-- Her kommer containeren med animationen -->
    <figure id="jitter-container"></figure>

    <!-- Knapper -->
    <button id="play-btn">Spil</button>
    <button id="pause-btn">Pause</button>
    <button id="stop-btn">Stop</button>

    <!-- Load dit Script nederst på siden - så er alle elementer indlæst -->
    <script src="js/jitterAnimation.js"></script>
</body>
</html>
